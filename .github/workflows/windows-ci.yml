name: Windows CI & Installer Verification

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      require_signing:
        description: 'Fail build if trusted Authenticode signing is not configured'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Test & Verify Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        shell: pwsh
        run: |
          $out = flutter analyze --no-fatal-infos 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in ($out -split "`r?`n")) {
              if ($line -match "error\s*[•-]|warning\s*[•-]") {
                Write-Host "::error::$line"
              }
            }
            exit 1
          }

      - name: Run widget & unit tests
        shell: pwsh
        run: |
          $out = flutter test --reporter expanded 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in ($out -split "`r?`n")) {
              if ($line -match "\[E\]|Expected:|Actual:|EXCEPTION|Error:|failed") {
                Write-Host "::error::$line"
              }
            }
            exit 1
          }

      - name: Extract app version and release gate mode
        shell: pwsh
        run: |
          $line = Select-String -Path "pubspec.yaml" -Pattern "^version:\s*([0-9]+\.[0-9]+\.[0-9]+)" | Select-Object -First 1
          if (-not $line) { throw "Could not parse version from pubspec.yaml" }
          $appVersion = $line.Matches.Groups[1].Value
          $isTagRelease = "${{ github.ref }}".StartsWith("refs/tags/v")
          $requireSigning = ($isTagRelease -or "${{ inputs.require_signing }}" -eq "true").ToString().ToLowerInvariant()
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REQUIRE_SIGNING=$requireSigning" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using APP_VERSION=$appVersion, REQUIRE_SIGNING=$requireSigning"

      - name: Ensure multi-resolution Windows icon (16, 24, 32, 48, 64, 128, 256)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "scripts\generate_multi_res_icon.ps1" -IconPath "assets\icons\icon.ico"

      - name: Build Windows Release
        shell: pwsh
        run: |
          $out = flutter build windows --release --dart-define=APP_VERSION=${{ env.APP_VERSION }} 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in ($out -split "`r?`n")) {
              if ($line -match "error\s+[A-Z0-9]+:|fatal error|mt\.exe|rc\.exe|LINK :|CMake Error") {
                Write-Host "::error::$line"
              }
            }
            exit 1
          }

      - name: Verify PE architecture, manifest, icon resources & CRT dependencies
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "dumpbin.exe" -Recurse | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1 -ExpandProperty FullName
          $exe = "build\windows\x64\runner\Release\FolkTool.exe"
          if (-not (Test-Path $exe)) { throw "Missing release executable: $exe" }
          if (-not $dumpbin) {
            Write-Warning "dumpbin.exe not found; skipping PE inspection"
          } else {
            $headers = & $dumpbin /headers $exe | Out-String
            if ($headers -notmatch "x64") {
              throw "FolkTool.exe is not an x64 binary!"
            }
            Write-Host "=== FolkTool.exe Dependencies ==="
            & $dumpbin /dependents $exe
            Write-Host "=== flutter_windows.dll Dependencies ==="
            & $dumpbin /dependents "build\windows\x64\runner\Release\flutter_windows.dll"
          }

          $verInfo = (Get-Item $exe).VersionInfo
          Write-Host "FileVersionInfo: Product=$($verInfo.ProductName) | Company=$($verInfo.CompanyName) | Desc=$($verInfo.FileDescription) | Ver=$($verInfo.ProductVersion)"
          & pwsh -NoProfile -File "scripts\verify_pe_icon.ps1" -BinaryPath $exe

      - name: Verify VC++ Redistributable download URL
        shell: pwsh
        run: |
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -UseBasicParsing
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "VC++ Redistributable URL check failed with status $($response.StatusCode)"
          }
          Write-Host "VC++ Redistributable URL reachable (HTTP $($response.StatusCode))"

      - name: Audit bundled third-party binaries (upstream trust inventory)
        shell: pwsh
        run: |
          $bundled = @()
          foreach ($dir in @("bin", "kp_versions\windows", "drive")) {
            if (Test-Path $dir) {
              $bundled += Get-ChildItem -Path $dir -File | Where-Object { $_.Extension -in ".exe", ".dll" } | Select-Object -ExpandProperty FullName
            }
          }
          & "$PWD\scripts\audit_pe_trust.ps1" -Targets $bundled

      - name: Configure Signing Provider (non-PR builds only)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in Windows Kits" }
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $hasAzure = (-not [string]::IsNullOrWhiteSpace($env:AZURE_ENDPOINT)) -and
                      (-not [string]::IsNullOrWhiteSpace($env:AZURE_ACCOUNT)) -and
                      (-not [string]::IsNullOrWhiteSpace($env:AZURE_PROFILE)) -and
                      (-not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) -and
                      (-not [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) -and
                      (-not [string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID))

          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:CERT_B64)

          if ($hasAzure) {
            "SIGN_MODE=azure" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "IS_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Configured signing mode: Microsoft Artifact Signing"
          } elseif ($hasPfx) {
            "SIGN_MODE=pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "IS_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Configured signing mode: Commercial OV PFX certificate"
          } else {
            "SIGN_MODE=none" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "IS_SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            if ($env:REQUIRE_SIGNING -eq "true") {
              throw "Production release requires trusted Authenticode signing (configure Microsoft Artifact Signing or WINDOWS_CERT_PFX_BASE64)."
            }
            Write-Host "::notice::UNSIGNED TEST BUILD - No trusted signing credentials configured. Publishing is blocked on release tags."
          }

      - name: Ensure PR builds remain unsigned and isolated from secrets
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          "SIGN_MODE=none" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "::notice::PR verification build (unsigned test build; signing secrets intentionally withheld)."

      - name: Azure OIDC Login for Microsoft Artifact Signing
        if: env.SIGN_MODE == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Microsoft Artifact Signing Client Tools
        if: env.SIGN_MODE == 'azure'
        shell: pwsh
        run: |
          winget install --exact --id Microsoft.Azure.ArtifactSigningClientTools --accept-source-agreements --accept-package-agreements
          $dlib = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft", "C:\Program Files*" -Filter "Azure.CodeSigning.Dlib.dll" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dlib) { throw "Azure.CodeSigning.Dlib.dll not found after installation." }
          $metaPath = Join-Path $env:RUNNER_TEMP "artifact-signing-metadata.json"
          @{
            Endpoint = "${{ vars.AZURE_SIGNING_ENDPOINT }}"
            CodeSigningAccountName = "${{ vars.AZURE_SIGNING_ACCOUNT }}"
            CertificateProfileName = "${{ vars.AZURE_SIGNING_PROFILE }}"
          } | ConvertTo-Json | Out-File -FilePath $metaPath -Encoding utf8
          "AZURE_DLIB_PATH=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AZURE_META_PATH=$metaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign First-Party Release Binaries
        if: env.IS_SIGNED == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $targets = Get-ChildItem -Path $releaseDir -File | Where-Object { $_.Extension -in ".exe", ".dll" } | Select-Object -ExpandProperty FullName
          if ($targets.Count -eq 0) { throw "No release binaries found in $releaseDir" }

          if ($env:SIGN_MODE -eq "azure") {
            foreach ($t in $targets) {
              $sig = Get-AuthenticodeSignature -LiteralPath $t
              if ($sig.Status -eq "Valid" -and $sig.SignerCertificate.Subject -like "*Microsoft*") {
                Write-Host "Preserving existing Microsoft signature on $t"
                continue
              }
              & "$env:SIGNTOOL_PATH" sign /v /fd SHA256 /tr "http://timestamp.acs.microsoft.com" /td SHA256 `
                /dlib "$env:AZURE_DLIB_PATH" /dmdf "$env:AZURE_META_PATH" $t
              if ($LASTEXITCODE -ne 0) { throw "Artifact Signing failed for $t" }
            }
          } elseif ($env:SIGN_MODE -eq "pfx") {
            $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_B64))
            try {
              foreach ($t in $targets) {
                $sig = Get-AuthenticodeSignature -LiteralPath $t
                if ($sig.Status -eq "Valid" -and $sig.SignerCertificate.Subject -like "*Microsoft*") {
                  Write-Host "Preserving existing Microsoft signature on $t"
                  continue
                }
                & "$env:SIGNTOOL_PATH" sign /f $pfxPath /p $env:CERT_PASS /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $t
                if ($LASTEXITCODE -ne 0) { throw "PFX signing failed for $t" }
              }
            } finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

          & "$PWD\scripts\audit_pe_trust.ps1" -Targets $targets -RequireValidSignature -SigntoolPath $env:SIGNTOOL_PATH

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installation."
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile installer.iss (with SignedUninstaller when enabled) & verify installer icon/signature
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"
          $isccArgs = @(
            "/DMyAppVersion=$env:APP_VERSION",
            "/DMyAppRepoUrl=$repoUrl"
          )

          if ($env:SIGN_MODE -eq "azure") {
            $signCmd = "`"$env:SIGNTOOL_PATH`" sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$env:AZURE_DLIB_PATH`" /dmdf `"$env:AZURE_META_PATH`" `$f"
            $isccArgs += "/DEnableSigning=1"
            $isccArgs += "/Sfolktool_sign=$signCmd"
            & "$env:ISCC" @isccArgs installer.iss
            if ($LASTEXITCODE -ne 0) { throw "installer.iss signed compilation failed" }
          } elseif ($env:SIGN_MODE -eq "pfx") {
            $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_B64))
            try {
              $signCmd = "`"$env:SIGNTOOL_PATH`" sign /f `"$pfxPath`" /p `"$env:CERT_PASS`" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `$f"
              $isccArgs += "/DEnableSigning=1"
              $isccArgs += "/Sfolktool_sign=$signCmd"
              & "$env:ISCC" @isccArgs installer.iss
              if ($LASTEXITCODE -ne 0) { throw "installer.iss signed compilation failed" }
            } finally {
              Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            }
          } else {
            & "$env:ISCC" @isccArgs installer.iss
            if ($LASTEXITCODE -ne 0) { throw "installer.iss compilation failed" }
          }

          $setupExe = "installer\FolkTool-Setup.exe"
          if (-not (Test-Path $setupExe)) { throw "Expected output $setupExe not found" }
          & pwsh -NoProfile -File "scripts\verify_pe_icon.ps1" -BinaryPath $setupExe

          if ($env:IS_SIGNED -eq "true") {
            & "$PWD\scripts\audit_pe_trust.ps1" -Targets @($setupExe) -RequireValidSignature -SigntoolPath $env:SIGNTOOL_PATH
          }

      - name: Smoke test install, upgrade/repair, running-app close, clean install, uninstall & reinstall
        shell: pwsh
        run: |
          try {
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $appIdKey = "Software\Microsoft\Windows\CurrentVersion\Uninstall\{A1B2C3D4-E5F6-4789-A0B1-C2D3E4F5A6B7}_is1"
          $docsRoot = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "FolkTool"
          $appDataRoot = Join-Path $env:APPDATA "FolkTool"
          $customDir = "C:\Temp\FolkToolCustomInstall"
          $defaultDir = "C:\Program Files\FolkTool"

          function Assert-InstalledFiles([string]$Dir) {
            foreach ($rel in @(
              "FolkTool.exe", "flutter_windows.dll", "url_launcher_windows_plugin.dll", "unins000.exe",
              "bin\kptools.exe", "bin\adb.exe", "bin\fastboot.exe", "bin\msys-2.0.dll",
              "apk\APatch.apk", "apk\FolkPatch.apk", "assets\kpimg",
              "kp_versions\folkpatch\kpimg", "kp_versions\apatch\kpimg"
            )) {
              $p = Join-Path $Dir $rel
              if (-not (Test-Path $p)) { throw "Missing installed file: $p" }
            }
          }

          function Assert-AppLaunchesInWorkingArea([string]$ExePath) {
            $appProc = Start-Process -FilePath $ExePath -PassThru
            $hwnd = [IntPtr]::Zero
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $appProc.Refresh()
              if ($appProc.HasExited) { throw "FolkTool.exe exited prematurely with code $($appProc.ExitCode)" }
              if ($appProc.MainWindowHandle -ne [IntPtr]::Zero) {
                $hwnd = $appProc.MainWindowHandle
                break
              }
            }
            if ($hwnd -eq [IntPtr]::Zero) {
              Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
              throw "FolkTool.exe window handle did not initialize within 10 seconds"
            }
            if (-not ("Win32Bounds" -as [type])) {
              Add-Type -TypeDefinition ('
              using System;
              using System.Runtime.InteropServices;
              public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              public class Win32Bounds {
                [DllImport("user32.dll")]
                public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
                [DllImport("user32.dll")]
                public static extern bool SystemParametersInfo(uint uiAction, uint uiParam, out RECT pvParam, uint fWinIni);
              }')
            }
            $rect = New-Object RECT
            $work = New-Object RECT
            [Win32Bounds]::GetWindowRect($hwnd, [ref]$rect) | Out-Null
            [Win32Bounds]::SystemParametersInfo(0x0030, 0, [ref]$work, 0) | Out-Null
            Write-Host "WindowRect: L=$($rect.Left) T=$($rect.Top) R=$($rect.Right) B=$($rect.Bottom) | WorkingArea: R=$($work.Right) B=$($work.Bottom)"
            if ($rect.Top -lt $work.Top -or $rect.Left -lt $work.Left -or $rect.Right -gt $work.Right -or $rect.Bottom -gt $work.Bottom) {
              Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
              throw "Window extends outside usable WorkingArea!"
            }
            return $appProc
          }

          Write-Host "=== 1. First-time install to custom non-default path ($customDir) ==="
          $log1 = (Join-Path $PWD "artifacts\install-smoke.log")
          $p1 = Start-Process -FilePath "installer\FolkTool-Setup.exe" `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS /DIR=`"$customDir`" /LOG=`"$log1`"" `
            -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "First install failed with $($p1.ExitCode)" }
          Assert-InstalledFiles $customDir

          $uninsExe1 = Join-Path $customDir "unins000.exe"
          & "$PWD\scripts\verify_pe_icon.ps1" -BinaryPath $uninsExe1
          if ($env:IS_SIGNED -eq "true") {
            & "$PWD\scripts\audit_pe_trust.ps1" -Targets @((Join-Path $customDir "FolkTool.exe"), $uninsExe1) -RequireValidSignature -SigntoolPath $env:SIGNTOOL_PATH
          } else {
            & "$PWD\scripts\audit_pe_trust.ps1" -Targets @((Join-Path $customDir "FolkTool.exe"), $uninsExe1)
          }

          $regPath = "HKLM:\$appIdKey"
          if (-not (Test-Path $regPath)) { throw "Uninstall registry entry missing at $regPath" }
          $regProps = Get-ItemProperty $regPath
          Write-Host "Uninstall Reg: DisplayName=$($regProps.DisplayName) | Ver=$($regProps.DisplayVersion) | DisplayIcon=$($regProps.DisplayIcon)"
          if ($regProps.DisplayName -ne "FolkTool") { throw "Unexpected DisplayName: $($regProps.DisplayName)" }

          Write-Host "=== 2. Seed simulated user settings, patched output, backup & logs ==="
          New-Item -ItemType Directory -Force -Path (Join-Path $appDataRoot "FolkTool") | Out-Null
          '{"flutter.settings_confirm_flash":true}' | Out-File -FilePath (Join-Path $appDataRoot "FolkTool\shared_preferences.json") -Encoding utf8
          foreach ($sub in @("patched", "backup", "logs")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $docsRoot $sub) | Out-Null
          }
          $userPatched = Join-Path $docsRoot "patched\user_boot_patched.img"
          $userBackup = Join-Path $docsRoot "backup\stock_boot_backup.img"
          $userLog = Join-Path $docsRoot "logs\diag_test.txt"
          "BOOT_IMG_DATA" | Out-File -FilePath $userPatched -Encoding utf8
          "STOCK_BACKUP" | Out-File -FilePath $userBackup -Encoding utf8
          "DIAG_LOG" | Out-File -FilePath $userLog -Encoding utf8

          Write-Host "=== 3. Repair / upgrade simulation (restore deleted DLL & preserve user data) ==="
          Remove-Item (Join-Path $customDir "url_launcher_windows_plugin.dll") -Force
          $pRepair = Start-Process -FilePath "installer\FolkTool-Setup.exe" `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS /DIR=`"$customDir`"" `
            -Wait -PassThru
          if ($pRepair.ExitCode -ne 0) { throw "Repair/upgrade failed with $($pRepair.ExitCode)" }
          Assert-InstalledFiles $customDir
          if (-not (Test-Path (Join-Path $appDataRoot "FolkTool\shared_preferences.json"))) { throw "Settings were lost during upgrade/repair!" }
          if (-not (Test-Path $userPatched) -or -not (Test-Path $userBackup)) { throw "User files were lost during upgrade/repair!" }

          $matchesHKLM = @(Get-ChildItem "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" | Where-Object { $_.PSChildName -eq "{A1B2C3D4-E5F6-4789-A0B1-C2D3E4F5A6B7}_is1" -or $_.GetValue("DisplayName") -eq "FolkTool" })
          if ($matchesHKLM.Count -ne 1) { throw "Expected exactly 1 Uninstall entry, found $($matchesHKLM.Count)" }

          Write-Host "=== 4. Running application + Clean Install verification ==="
          $runningProc = Assert-AppLaunchesInWorkingArea (Join-Path $customDir "FolkTool.exe")
          $pClean = Start-Process -FilePath "installer\FolkTool-Setup.exe" `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS /CLEANINSTALL /ALLUSERS /DIR=`"$customDir`"" `
            -Wait -PassThru
          if ($pClean.ExitCode -ne 0) { throw "Clean install failed with $($pClean.ExitCode)" }
          $runningProc.Refresh()
          if (-not $runningProc.HasExited) {
            Stop-Process -Id $runningProc.Id -Force
            throw "Installer failed to stop running FolkTool.exe prior to clean install!"
          }
          Assert-InstalledFiles $customDir
          if (-not (Test-Path (Join-Path $appDataRoot "FolkTool\shared_preferences.json"))) { throw "Clean install deleted settings unexpectedly without /PURGEAPPDATA!" }
          if (-not (Test-Path $userPatched) -or -not (Test-Path $userBackup)) { throw "Clean install deleted user boot/backup files!" }

          Write-Host "=== 5. Uninstall preserving user data ==="
          $uninstLog1 = (Join-Path $PWD "artifacts\uninstall-smoke.log")
          $pUnins1 = Start-Process -FilePath $uninsExe1 -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$uninstLog1`"" -Wait -PassThru
          if ($pUnins1.ExitCode -ne 0) { throw "Uninstall failed with $($pUnins1.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $customDir "FolkTool.exe")) { throw "FolkTool.exe still exists after uninstall!" }
          if (Test-Path $regPath) { throw "Uninstall registry key still exists!" }
          if (-not (Test-Path (Join-Path $appDataRoot "FolkTool\shared_preferences.json"))) { throw "Standard uninstall deleted settings!" }
          if (-not (Test-Path $userPatched) -or -not (Test-Path $userBackup) -or -not (Test-Path $userLog)) {
            throw "Standard uninstall deleted user files or logs!"
          }

          Write-Host "=== 6. Reinstall after uninstall -> Uninstall with /PURGEAPPDATA ==="
          $pReinstall = Start-Process -FilePath "installer\FolkTool-Setup.exe" `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS /DIR=`"$defaultDir`"" `
            -Wait -PassThru
          if ($pReinstall.ExitCode -ne 0) { throw "Reinstall failed with $($pReinstall.ExitCode)" }
          Assert-InstalledFiles $defaultDir
          $reinstalledProc = Assert-AppLaunchesInWorkingArea (Join-Path $defaultDir "FolkTool.exe")
          Stop-Process -Id $reinstalledProc.Id -Force

          $pUninsPurge = Start-Process -FilePath (Join-Path $defaultDir "unins000.exe") `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PURGEAPPDATA" -Wait -PassThru
          if ($pUninsPurge.ExitCode -ne 0) { throw "Purge uninstall failed with $($pUninsPurge.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $defaultDir "FolkTool.exe")) { throw "FolkTool.exe still exists after purge uninstall!" }
          if (Test-Path $appDataRoot) { throw "AppData settings were not cleaned on /PURGEAPPDATA!" }
          if (Test-Path $userLog) { throw "Log file was not cleaned on /PURGEAPPDATA!" }
          if (-not (Test-Path $userPatched) -or -not (Test-Path $userBackup)) {
            throw "/PURGEAPPDATA must NEVER delete user patched/backup boot images!"
          }
          Remove-Item -Recurse -Force $docsRoot -ErrorAction SilentlyContinue
          Write-Host "All Windows installer lifecycle smoke checks passed cleanly."
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            foreach ($diagFile in @("artifacts\uninstall-smoke.log", "artifacts\install-smoke.log")) {
              if (Test-Path $diagFile) {
                $tailLines = (Get-Content $diagFile | Select-Object -Last 40) -join " | "
                Write-Host "::error::${diagFile}: $tailLines"
              }
            }
            throw
          }

      - name: Package Portable ZIP & Generate Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts\portable" | Out-Null
          Copy-Item -Recurse -Force "build\windows\x64\runner\Release\*" "artifacts\portable\"
          Copy-Item -Recurse -Force "bin" "artifacts\portable\bin"
          Copy-Item -Recurse -Force "apk" "artifacts\portable\apk"
          Copy-Item -Recurse -Force "assets" "artifacts\portable\assets"
          Copy-Item -Recurse -Force "kp_versions" "artifacts\portable\kp_versions"
          @"
          FolkTool v$env:APP_VERSION (Windows x64 Portable)
          Commit: $env:GITHUB_SHA
          Authenticode Signed: $env:IS_SIGNED
          Signing Mode: $env:SIGN_MODE
          Note: If Authenticode Signed is false, this is an unsigned CI test build.
          "@ | Out-File -FilePath "artifacts\portable\BUILD_INFO.txt" -Encoding utf8
          Compress-Archive -Path "artifacts\portable\*" -DestinationPath "artifacts\FolkTool-Windows-Portable.zip" -Force

          $setupHash = (Get-FileHash "installer\FolkTool-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash "artifacts\FolkTool-Windows-Portable.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setupHash *FolkTool-Setup.exe",
            "$zipHash *FolkTool-Windows-Portable.zip"
          ) | Out-File -FilePath "artifacts\SHA256SUMS.txt" -Encoding ascii

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolkTool-Setup-Windows
          path: installer/FolkTool-Setup.exe
          if-no-files-found: error

      - name: Upload Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolkTool-Windows-Portable
          path: artifacts/FolkTool-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload Checksums Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolkTool-Checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-CI-Diagnostic-Logs
          path: artifacts/install-smoke.log
          if-no-files-found: ignore

      - name: Write Job Summary
        shell: pwsh
        run: |
          $setupSizeMB = [math]::Round((Get-Item "installer\FolkTool-Setup.exe").Length / 1MB, 2)
          $zipSizeMB = [math]::Round((Get-Item "artifacts\FolkTool-Windows-Portable.zip").Length / 1MB, 2)
          $setupHash = (Get-FileHash "installer\FolkTool-Setup.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash "artifacts\FolkTool-Windows-Portable.zip" -Algorithm SHA256).Hash
          @"
          ## Windows CI Verification Summary
          - **Signing Status**: ``IS_SIGNED=$env:IS_SIGNED`` (mode: ``$env:SIGN_MODE``)
          - **Static Analysis & Unit/Widget Tests**: Passed
          - **Multi-Resolution PE Icon Audit (FolkTool.exe, Setup, Uninstaller)**: Passed
          - **Lifecycle Smoke Tests (Install Custom Path, Upgrade/Repair, Running-App Clean Install, Uninstall Preserve Data, Reinstall, Uninstall + PurgeAppData)**: Passed
          - **Artifacts**:
            - `FolkTool-Setup.exe` ($setupSizeMB MB) — SHA-256: ``$setupHash``
            - `FolkTool-Windows-Portable.zip` ($zipSizeMB MB) — SHA-256: ``$zipHash``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  release:
    name: Publish GitHub Release
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: FolkTool-Setup-Windows
          path: release-assets

      - name: Download portable ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: FolkTool-Windows-Portable
          path: release-assets

      - name: Download checksums artifact
        uses: actions/download-artifact@v4
        with:
          name: FolkTool-Checksums
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/FolkTool-Setup.exe
            release-assets/FolkTool-Windows-Portable.zip
            release-assets/SHA256SUMS.txt