name: Windows CI & Installer Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build, Test & Verify Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run widget & unit tests
        run: flutter test --reporter expanded

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Verify PE architecture & CRT dependencies
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "dumpbin.exe" -Recurse | Where-Object { $_.FullName -match "Hostx64\\x64" } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            Write-Warning "dumpbin.exe not found; skipping PE inspection"
            exit 0
          }
          $exe = "build\windows\x64\runner\Release\FolkTool.exe"
          $headers = & $dumpbin /headers $exe | Out-String
          if ($headers -notmatch "x64") {
            throw "FolkTool.exe is not an x64 binary!"
          }
          Write-Host "=== FolkTool.exe Dependencies ==="
          & $dumpbin /dependents $exe
          Write-Host "=== flutter_windows.dll Dependencies ==="
          & $dumpbin /dependents "build\windows\x64\runner\Release\flutter_windows.dll"

      - name: Verify VC++ Redistributable download URL
        shell: pwsh
        run: |
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -UseBasicParsing
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "VC++ Redistributable URL check failed with status $($response.StatusCode)"
          }
          Write-Host "VC++ Redistributable URL reachable (HTTP $($response.StatusCode))"

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installation."
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile installer.iss
        shell: pwsh
        run: |
          & "$env:ISCC" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer.iss compilation failed" }
          if (-not (Test-Path "installer\FolkTool-Setup.exe")) {
            throw "Expected output installer\FolkTool-Setup.exe not found"
          }

      - name: Stage release folder and compile install.iss
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\FolkTool-Windows-Release" | Out-Null
          Copy-Item -Recurse -Force "build\windows\x64\runner\Release\*" "release\FolkTool-Windows-Release\"
          & "$env:ISCC" install.iss
          if ($LASTEXITCODE -ne 0) { throw "install.iss compilation failed" }
          if (-not (Test-Path "release\FolkTool-Setup-v1.7.0.exe")) {
            throw "Expected output release\FolkTool-Setup-v1.7.0.exe not found"
          }

      - name: Smoke test silent install, window bounds, and uninstall
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $logPath = (Join-Path $PWD "artifacts\install-smoke.log")
          Write-Host "Installing FolkTool-Setup.exe silently..."
          $installProc = Start-Process -FilePath "installer\FolkTool-Setup.exe" `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$logPath`"" `
            -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            throw "Silent installer exited with code $($installProc.ExitCode)"
          }

          $installDir = "C:\Program Files\FolkTool"
          $exePath = Join-Path $installDir "FolkTool.exe"
          $requiredPaths = @(
            $exePath,
            (Join-Path $installDir "flutter_windows.dll"),
            (Join-Path $installDir "url_launcher_windows_plugin.dll"),
            (Join-Path $installDir "bin\kptools.exe"),
            (Join-Path $installDir "bin\adb.exe"),
            (Join-Path $installDir "bin\fastboot.exe"),
            (Join-Path $installDir "bin\msys-2.0.dll"),
            (Join-Path $installDir "assets\kpimg"),
            (Join-Path $installDir "kp_versions\folkpatch\kpimg"),
            (Join-Path $installDir "kp_versions\apatch\kpimg")
          )
          foreach ($p in $requiredPaths) {
            if (-not (Test-Path $p)) {
              throw "Missing installed file: $p"
            }
          }

          Write-Host "Launching installed FolkTool.exe..."
          $appProc = Start-Process -FilePath $exePath -PassThru
          $hwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            $appProc.Refresh()
            if ($appProc.HasExited) {
              throw "FolkTool.exe exited prematurely with code $($appProc.ExitCode)"
            }
            if ($appProc.MainWindowHandle -ne [IntPtr]::Zero) {
              $hwnd = $appProc.MainWindowHandle
              break
            }
          }
          if ($hwnd -eq [IntPtr]::Zero) {
            Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
            throw "FolkTool.exe window handle did not initialize within 10 seconds"
          }

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          public class Win32Bounds {
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [DllImport("user32.dll")]
            public static extern bool SystemParametersInfo(uint uiAction, uint uiParam, out RECT pvParam, uint fWinIni);
          }
          "@
          $rect = New-Object RECT
          $work = New-Object RECT
          [Win32Bounds]::GetWindowRect($hwnd, [ref]$rect) | Out-Null
          [Win32Bounds]::SystemParametersInfo(0x0030, 0, [ref]$work, 0) | Out-Null
          Write-Host "WindowRect: L=$($rect.Left) T=$($rect.Top) R=$($rect.Right) B=$($rect.Bottom)"
          Write-Host "WorkingArea: L=$($work.Left) T=$($work.Top) R=$($work.Right) B=$($work.Bottom)"

          if ($rect.Top -lt $work.Top -or $rect.Left -lt $work.Left -or $rect.Right -gt $work.Right -or $rect.Bottom -gt $work.Bottom) {
            Stop-Process -Id $appProc.Id -Force -ErrorAction SilentlyContinue
            throw "Window extends outside usable WorkingArea (taskbar overlap detected)!"
          }
          Write-Host "Verified: FolkTool.exe window fits cleanly inside WorkingArea (PID=$($appProc.Id), Title='$($appProc.MainWindowTitle)')"
          Stop-Process -Id $appProc.Id -Force

          Write-Host "Uninstalling FolkTool silently..."
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstProc = Start-Process -FilePath $uninstaller `
              -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
              -Wait -PassThru
            if ($uninstProc.ExitCode -ne 0) {
              throw "Uninstaller exited with code $($uninstProc.ExitCode)"
            }
            Start-Sleep -Seconds 2
            if (Test-Path $exePath) {
              throw "FolkTool.exe still exists after uninstallation!"
            }
          }

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts\portable" | Out-Null
          Copy-Item -Recurse -Force "build\windows\x64\runner\Release\*" "artifacts\portable\"
          Copy-Item -Recurse -Force "bin" "artifacts\portable\bin"
          Copy-Item -Recurse -Force "assets" "artifacts\portable\assets"
          Copy-Item -Recurse -Force "kp_versions" "artifacts\portable\kp_versions"
          Compress-Archive -Path "artifacts\portable\*" -DestinationPath "artifacts\FolkTool-Windows-Portable.zip" -Force

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolkTool-Setup-Windows
          path: installer/FolkTool-Setup.exe
          if-no-files-found: error

      - name: Upload Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolkTool-Windows-Portable
          path: artifacts/FolkTool-Windows-Portable.zip
          if-no-files-found: error

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-CI-Diagnostic-Logs
          path: artifacts/install-smoke.log
          if-no-files-found: ignore

      - name: Write Job Summary
        shell: pwsh
        run: |
          $setupSizeMB = [math]::Round((Get-Item "installer\FolkTool-Setup.exe").Length / 1MB, 2)
          $zipSizeMB = [math]::Round((Get-Item "artifacts\FolkTool-Windows-Portable.zip").Length / 1MB, 2)
          $setupHash = (Get-FileHash "installer\FolkTool-Setup.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash "artifacts\FolkTool-Windows-Portable.zip" -Algorithm SHA256).Hash
          @"
          ## Windows CI Verification Summary
          - **Static Analysis (`flutter analyze`)**: Passed
          - **Widget Tests (`flutter test`)**: Passed
          - **Windows Release Build & PE x64 Audit (`dumpbin`)**: Passed
          - **Inno Setup Scripts**: `installer.iss` and `install.iss` both compiled cleanly
          - **Silent Install -> Window Bounds / Taskbar Check -> Clean Uninstall**: Passed
          - **Artifacts**:
            - `FolkTool-Setup.exe` ($setupSizeMB MB) — SHA-256: ``$setupHash``
            - `FolkTool-Windows-Portable.zip` ($zipSizeMB MB) — SHA-256: ``$zipHash``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
