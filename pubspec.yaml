name: FolkTool
description: "FolkTool - KernelPatch 自动刷入工具"
publish_to: 'none'
version: 1.7.0+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  path: ^1.8.0
  shared_preferences: ^2.2.0
  intl: ^0.20.2
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.4

flutter:
  generate: true
  uses-material-design: true

  # Only driver installers are extracted via rootBundle; bin/, apk/, assets/kpimg,
  # and kp_versions/ are distributed beside FolkTool.exe directly without duplicating
  # ~37 MB into data/flutter_assets/.
  assets:
    - drive/

flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/generated
  use_deferred_loading: false
  output_localization_file: l10n.dart
  main_class: AppLocalizations
